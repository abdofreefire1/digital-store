<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Store - المتجر الرقمي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4f46e5',
                        secondary: '#10b981'
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap');
        body { font-family: 'Tajawal', sans-serif; background-color: #f3f4f6; }
    </style>
</head>
<body class="text-gray-800 antialiased flex flex-col min-h-screen">
    
    <!-- Navbar -->
    <nav class="bg-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="index.html" class="flex-shrink-0 flex items-center">
                        <i class="fa-solid fa-store text-primary text-2xl ml-2"></i>
                        <span class="font-bold text-xl text-gray-900">Digital Store</span>
                    </a>
                </div>
                <div class="hidden sm:ml-6 sm:flex sm:space-x-8 sm:space-x-reverse items-center">
                    <a href="index.html" class="border-primary text-gray-900 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">الرئيسية</a>
                    <a href="#products" class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">المنتجات</a>
                    <a href="order.html" class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">تتبع الطلب</a>
                </div>
                <div class="flex items-center">
                    <div class="relative ml-3">
                        <!-- Lang switcher placeholder -->
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Hero -->
    <div class="bg-primary pb-8 sm:pb-12 lg:pb-12">
        <div class="pt-8 overflow-hidden sm:pt-12 lg:relative lg:py-16">
            <div class="mx-auto max-w-md px-4 sm:max-w-3xl sm:px-6 lg:px-8 lg:max-w-7xl lg:grid lg:grid-cols-2 lg:gap-24">
                <div class="text-center lg:text-right">
                    <h1 class="text-4xl tracking-tight font-extrabold text-white sm:text-5xl md:text-6xl">
                        <span class="block">أفضل المنتجات الرقمية</span>
                        <span class="block text-secondary">بأسعار لا تقبل المنافسة</span>
                    </h1>
                    <p class="mt-3 max-w-md mx-auto text-base text-indigo-200 sm:text-lg md:mt-5 md:text-xl md:max-w-3xl">
                        اشترك في خدماتك المفضلة، احصل على بطاقات الهدايا وتفعيلات البرامج فوراً بعد الدفع.
                    </p>
                    <div class="mt-10 sm:flex sm:justify-center lg:justify-start">
                        <div class="rounded-md shadow">
                            <a href="#products" class="w-full flex items-center justify-center px-8 py-3 border border-transparent text-base font-medium rounded-md text-primary bg-white hover:bg-gray-50 md:py-4 md:text-lg md:px-10">
                                تصفح المنتجات
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Products Section -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12" id="products">
        <h2 class="text-3xl font-extrabold text-gray-900 mb-8 text-center">أحدث المنتجات</h2>
        
        <!-- Loading State -->
        <div id="loading" class="flex justify-center items-center py-20">
            <i class="fa-solid fa-spinner fa-spin text-4xl text-primary"></i>
        </div>

        <!-- Products Grid -->
        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 hidden">
            <!-- Product Cards will be injected here via JS -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white mt-auto">
        <div class="max-w-7xl mx-auto py-12 px-4 sm:px-6 md:flex md:items-center md:justify-between lg:px-8">
            <div class="mt-8 md:mt-0 md:order-1">
                <p class="text-center text-base text-gray-400">
                    &copy; 2026 Digital Store. جميع الحقوق محفوظة.
                </p>
            </div>
        </div>
    </footer>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
