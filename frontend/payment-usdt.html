<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الدفع عبر USDT - Digital Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- QR Code Generator -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#4f46e5', secondary: '#10b981' } } } }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap');
        body { font-family: 'Tajawal', sans-serif; background-color: #f3f4f6; }
    </style>
</head>
<body class="text-gray-800 antialiased flex flex-col min-h-screen">
    
    <nav class="bg-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="index.html" class="flex items-center text-gray-900 font-bold text-xl">
                <i class="fa-solid fa-store text-primary ml-2"></i> Digital Store
            </a>
        </div>
    </nav>

    <main class="flex-grow max-w-lg mx-auto px-4 py-8 w-full">
        <div class="bg-white rounded-xl shadow-lg p-8 text-center border-t-4 border-primary">
            <h2 class="text-2xl font-bold mb-2">الدفع عبر USDT</h2>
            <p class="text-gray-500 mb-6" id="order-ref">طلب رقم: ...</p>

            <div class="bg-gray-50 p-4 rounded-lg mb-6 border">
                <p class="text-sm text-gray-500 mb-1">المبلغ المطلوب</p>
                <p class="text-3xl font-bold text-gray-900" id="usdt-amount">0.00 <span class="text-lg">USDT</span></p>
                <p class="text-xs text-red-500 mt-2 font-bold">الرجاء إرسال هذا المبلغ بالتحديد لتجنب فشل التحقق.</p>
            </div>

            <div class="mb-6 flex justify-center">
                <div id="qrcode" class="p-4 bg-white border rounded-xl inline-block"></div>
            </div>

            <div class="text-right bg-gray-50 p-4 rounded-lg border mb-6">
                <p class="text-sm text-gray-500 mb-1">عنوان المحفظة (<span id="network-name" class="font-bold">TRC20</span>)</p>
                <div class="flex items-center">
                    <input type="text" id="wallet-address" readonly class="w-full bg-white border-gray-300 rounded-r-md p-2 text-sm text-left font-mono" dir="ltr">
                    <button onclick="copyAddress()" class="bg-primary text-white px-4 py-2 rounded-l-md hover:bg-indigo-700">نسخ</button>
                </div>
            </div>

            <div class="text-center">
                <p class="text-sm text-gray-600 mb-4"><i class="fa-solid fa-circle-notch fa-spin text-primary"></i> بانتظار تأكيد الدفع التلقائي...</p>
                <p class="text-xs text-gray-400">لا تغلق هذه الصفحة حتى يتم تأكيد الدفع. يتم التحديث تلقائياً.</p>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const orderNumber = urlParams.get('order');
            
            const invoiceDataStr = localStorage.getItem('usdt_invoice');
            if (!invoiceDataStr || !orderNumber) {
                alert('بيانات الدفع غير متوفرة.');
                window.location.href = 'index.html';
                return;
            }

            const invoice = JSON.parse(invoiceDataStr);
            
            document.getElementById('order-ref').innerText = `طلب رقم: ${orderNumber}`;
            document.getElementById('usdt-amount').innerHTML = `${invoice.amountUsdt || '0.00'} <span class="text-lg">USDT</span>`;
            document.getElementById('network-name').innerText = invoice.network || 'TRC20';
            document.getElementById('wallet-address').value = invoice.paymentAddress || 'ADDRESS_NOT_PROVIDED';
            
            // Generate QR
            const qrData = invoice.qrData || `bitcoin:${invoice.paymentAddress}?amount=${invoice.amountUsdt}`;
            new QRCode(document.getElementById("qrcode"), {
                text: qrData,
                width: 200,
                height: 200,
            });
            
            // Here you would implement polling or Server-Sent Events to check payment status
            // setInterval(() => checkPaymentStatus(orderNumber), 10000);
        });

        function copyAddress() {
            const copyText = document.getElementById("wallet-address");
            copyText.select();
            copyText.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(copyText.value);
            alert("تم نسخ العنوان!");
        }
    </script>
</body>
</html>
