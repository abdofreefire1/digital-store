<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل المنتج - Digital Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#4f46e5', secondary: '#10b981' } } } }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap');
        body { font-family: 'Tajawal', sans-serif; background-color: #f3f4f6; }
    </style>
</head>
<body class="text-gray-800 antialiased flex flex-col min-h-screen">
    
    <!-- Navbar -->
    <nav class="bg-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="index.html" class="flex-shrink-0 flex items-center">
                        <i class="fa-solid fa-store text-primary text-2xl ml-2"></i>
                        <span class="font-bold text-xl text-gray-900">Digital Store</span>
                    </a>
                </div>
                <div class="hidden sm:ml-6 sm:flex sm:space-x-8 sm:space-x-reverse items-center">
                    <a href="index.html" class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">الرئيسية</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full">
        <div id="loading" class="flex justify-center items-center py-20">
            <i class="fa-solid fa-spinner fa-spin text-4xl text-primary"></i>
        </div>
        
        <div id="product-container" class="hidden bg-white rounded-xl shadow-lg overflow-hidden">
            <!-- Product Details injected here -->
        </div>
    </main>

    <footer class="bg-white mt-auto py-8 text-center text-gray-500">
        &copy; 2026 Digital Store.
    </footer>

    <script src="assets/js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');
            if (!productId) {
                window.location.href = 'index.html';
                return;
            }

            try {
                const response = await ApiService.get(`/products/${productId}`);
                document.getElementById('loading').classList.add('hidden');
                
                if (response.success) {
                    renderProduct(response.data);
                } else {
                    document.getElementById('product-container').innerHTML = '<p class="p-8 text-center text-red-500">المنتج غير موجود.</p>';
                    document.getElementById('product-container').classList.remove('hidden');
                }
            } catch (e) {
                document.getElementById('loading').innerHTML = '<p class="text-red-500">خطأ في التحميل.</p>';
            }
        });

        function renderProduct(product) {
            const container = document.getElementById('product-container');
            const image = product.image || 'https://placehold.co/600x400?text=Product';
            
            let fieldsHtml = '';
            if (product.required_fields && product.required_fields.length > 0) {
                fieldsHtml = `<div class="mt-6 p-4 bg-blue-50 rounded-lg">
                    <h4 class="font-bold mb-2">معلومات مطلوبة للتسليم:</h4>
                    <ul class="list-disc list-inside text-sm text-gray-700">
                        ${product.required_fields.map(f => `<li>${f.field_name}</li>`).join('')}
                    </ul>
                </div>`;
            }

            container.innerHTML = `
                <div class="md:flex">
                    <div class="md:flex-shrink-0 md:w-1/2">
                        <img class="h-64 w-full object-cover md:h-full" src="${image}" alt="${product.name}">
                    </div>
                    <div class="p-8 md:w-1/2 flex flex-col justify-center">
                        <div class="uppercase tracking-wide text-sm text-primary font-semibold">${product.category_name || 'عام'}</div>
                        <h1 class="block mt-1 text-3xl leading-tight font-bold text-gray-900">${product.name}</h1>
                        
                        <div class="mt-4 flex items-center">
                            <span class="text-3xl font-bold text-gray-900">${product.final_price_dzd} د.ج</span>
                            ${product.old_price_dzd ? `<span class="text-lg text-gray-500 line-through ml-3">${product.old_price_dzd} د.ج</span>` : ''}
                        </div>
                        
                        <p class="mt-4 text-gray-600 whitespace-pre-line">${product.description}</p>
                        
                        ${fieldsHtml}
                        
                        <div class="mt-8">
                            <a href="checkout.html?id=${product.id}" class="w-full bg-primary flex justify-center items-center text-white font-bold py-4 px-8 rounded-lg hover:bg-indigo-700 transition shadow-lg text-lg">
                                المتابعة للدفع <i class="fa-solid fa-arrow-left mr-2"></i>
                            </a>
                        </div>
                    </div>
                </div>
            `;
            container.classList.remove('hidden');
        }
    </script>
</body>
</html>
