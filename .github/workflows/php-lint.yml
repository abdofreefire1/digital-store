name: PHP syntax check
on:
  push:
    paths:
      - 'canva-pro-dz/**/*.php'
      - '.github/workflows/php-lint.yml'
  pull_request:
    paths:
      - 'canva-pro-dz/**/*.php'
      - '.github/workflows/php-lint.yml'
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Lint all PHP files
        shell: bash
        run: find canva-pro-dz -name '*.php' -print0 | xargs -0 -n1 php -l
